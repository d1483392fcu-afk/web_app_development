{% extends 'base.html' %}

{% block title %}{% if record %}編輯紀錄{% else %}新增紀錄{% endif %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
        <div class="d-flex align-items-center mb-4 gap-3">
            <a href="{{ url_for('records.index') }}" class="btn btn-outline-secondary border-0 rounded-circle p-2 px-3 shadow-sm bg-dark" style="color:var(--text-secondary)"><i class="bi bi-arrow-left fs-5"></i></a>
            <h2 class="fw-bold mb-0">{% if record %}📝 編輯紀錄{% else %}✍️ 記一筆{% endif %}</h2>
        </div>

        <div class="glass-card shadow-lg">
            <form action="{% if record %}{{ url_for('records.update', id=record.id) }}{% else %}{{ url_for('records.create') }}{% endif %}" method="POST">
                
                <!-- 收支類型切換 -->
                <div class="mb-4 text-center">
                    <div class="btn-group shadow-sm" role="group" style="width: 100%;">
                        <input type="radio" class="btn-check" name="type" id="typeExpense" autocomplete="off" value="expense" {% if not record or record.type == 'expense' %}checked{% endif %}>
                        <label class="btn btn-outline-danger fw-bold py-2" for="typeExpense">支出 (Expense)</label>
                      
                        <input type="radio" class="btn-check" name="type" id="typeIncome" autocomplete="off" value="income" {% if record and record.type == 'income' %}checked{% endif %}>
                        <label class="btn btn-outline-success fw-bold py-2" for="typeIncome">收入 (Income)</label>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-secondary fw-semibold">金額</label>
                    <div class="input-group input-group-lg shadow-sm">
                        <span class="input-group-text bg-dark border-secondary text-secondary fs-4">$</span>
                        <input type="number" step="0.01" min="0" class="form-control border-secondary text-light bg-dark fs-4 fw-bold" name="amount" value="{{ record.amount if record else '' }}" required placeholder="0.00">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-secondary fw-semibold">日期</label>
                    <input type="date" class="form-control form-control-lg border-secondary text-light bg-dark shadow-sm" name="date" value="{{ record.date if record else '' }}" required id="datePicker">
                </div>

                <div class="mb-4">
                    <label class="form-label text-secondary fw-semibold">分類</label>
                    <select class="form-select form-select-lg border-secondary bg-dark text-light shadow-sm" name="category_id">
                        <option value="">-- 不指定分類 --</option>
                        {% for cat in categories %}
                        <option value="{{ cat.id }}" data-type="{{ cat.type }}" {% if record and record.category_id == cat.id %}selected{% endif %}>
                            {{ cat.name }} {% if cat.type == 'income' %}(收入){% else %}(支出){% endif %}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label text-secondary fw-semibold">扣款 / 存入帳戶</label>
                    <select class="form-select form-select-lg border-secondary bg-dark text-light shadow-sm" name="account_id" required>
                        <option value="" disabled {% if not record %}selected{% endif %}>請選擇帳戶...</option>
                        {% for acc in accounts %}
                        <option value="{{ acc.id }}" {% if record and record.account_id == acc.id %}selected{% endif %}>
                            {{ acc.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label text-secondary fw-semibold">備註 (選填)</label>
                    <input type="text" class="form-control form-control-lg border-secondary text-light bg-dark shadow-sm" name="note" value="{{ record.note if record else '' }}" placeholder="例如：買咖啡, 午餐, 收到薪水...">
                </div>

                <div class="d-grid mt-5">
                    <button type="submit" class="btn btn-premium py-3 fs-5 fw-bold shadow">
                        {% if record %}儲存變更{% else %}確認記帳{% endif %}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // 自動帶入今天日期 (如果是新增的話)
    window.addEventListener('DOMContentLoaded', (event) => {
        const dateInput = document.getElementById('datePicker');
        if (!dateInput.value) {
            // Adjust to local date string instead of UTC
            const tzoffset = (new Date()).getTimezoneOffset() * 60000;
            const localISOTime = (new Date(Date.now() - tzoffset)).toISOString().slice(0, 10);
            dateInput.value = localISOTime;
        }

        // 動態篩選分類
        const typeRadios = document.querySelectorAll('input[name="type"]');
        const catOptions = document.querySelectorAll('select[name="category_id"] option[data-type]');
        
        function filterCategories() {
            const selectedType = document.querySelector('input[name="type"]:checked').value;
            catOptions.forEach(opt => {
                if (opt.getAttribute('data-type') === selectedType) {
                    opt.style.display = '';
                } else {
                    opt.style.display = 'none';
                }
            });
            // 重設下拉選項如果當前選項被隱藏了
            const selectTarget = document.querySelector('select[name="category_id"]');
            if(selectTarget.selectedOptions.length > 0 && selectTarget.selectedOptions[0].style.display === 'none'){
                selectTarget.value = "";
            }
        }
        
        typeRadios.forEach(radio => {
            radio.addEventListener('change', filterCategories);
        });
        
        filterCategories(); // init
    });
</script>
{% endblock %}
